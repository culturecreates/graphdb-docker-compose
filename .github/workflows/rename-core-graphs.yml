name: Rename Existing Backups in S3

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (list renames without applying them)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  S3_BUCKET_NAME: artsdata-graphdb-backups
  S3_REGION: ca-central-1

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.S3_REGION }}

      - name: Rename objects matching old naming pattern
        run: |
          set -euo pipefail
          BUCKET="${{ env.S3_BUCKET_NAME }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # Adjust these prefixes to cover every folder that needs renaming
          PREFIXES=("core-graph/daily/" "core-graph/monthly/")

          for PREFIX in "${PREFIXES[@]}"; do
            echo "=== Scanning prefix: $PREFIX ==="

            aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --prefix "$PREFIX" \
              --query "Contents[?ends_with(Key, '-artsdata-core.ttls.gz')].Key" \
              --output text | tr '\t' '\n' | while read -r OLD_KEY; do

                [ -z "$OLD_KEY" ] && continue

                FILENAME=$(basename "$OLD_KEY")
                DIRNAME=$(dirname "$OLD_KEY")

                # Skip files that already follow the new convention
                if [[ "$FILENAME" == artsdata-*-core.ttls.gz ]]; then
                  echo "SKIP (already renamed): $OLD_KEY"
                  continue
                fi

                # Extract DATE from "<DATE>-artsdata-core.ttls.gz"
                DATE="${FILENAME%-artsdata-core.ttls.gz}"
                NEW_FILENAME="artsdata-${DATE}-core.ttls.gz"
                NEW_KEY="${DIRNAME}/${NEW_FILENAME}"

                if [ "$DRY_RUN" == "true" ]; then
                  echo "[DRY RUN] Would rename: $OLD_KEY -> $NEW_KEY"
                else
                  echo "Renaming: $OLD_KEY -> $NEW_KEY"
                  aws s3api copy-object \
                    --bucket "$BUCKET" \
                    --copy-source "${BUCKET}/${OLD_KEY}" \
                    --key "$NEW_KEY"

                  aws s3api delete-object \
                    --bucket "$BUCKET" \
                    --key "$OLD_KEY"
                fi
            done
          done