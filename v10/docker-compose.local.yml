services:
  graphdb:
    image: ontotext/graphdb:10.6.3
    container_name: graphdb
    restart: always
    ports:
      - "7200:7200"
    command: >
      -Dgraphdb.workbench.importDirectory=/opt/graphdb/home/graphdb-import
      -Dgraphdb.workbench.cors.enable=true
      -Dgraphdb.home=/opt/graphdb/home
      -Xms2g
      -Xmx5g
      -XX:+UseG1GC
      -Dgraphdb.workbench.maxUploadSize=809715200
      -Dlabel.languages=en,fr
    volumes:
      - ../local/import:/opt/graphdb/home/graphdb-import
      - ../local/data:/opt/graphdb/home/data
      - ../plugins/artsdata-plugin/target/artsdata-plugin.jar:/opt/graphdb/dist/lib/plugins/artsdata-plugin/artsdata-plugin.jar:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
